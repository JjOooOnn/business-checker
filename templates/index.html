<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>국세청 사업자 및 매체 현황 조회</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .tab-buttons button { padding: 10px 15px; cursor: pointer; border: 1px solid #ccc; background-color: #f0f0f0; margin-right: 5px; }
        .tab-buttons button.active { background-color: #fff; border-bottom: 1px solid #fff; font-weight: bold; }
        .tab-content { border: 1px solid #ccc; padding: 20px; border-top: none; }
        .error { color: red; font-weight: bold; margin-top: 15px; }
        .info { background-color: #f0f8ff; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-size: 0.9em;}
        #excel-form, #media-form { display: none; } /* 기본 숨김 */
        textarea { width: 95%; height: 150px; }
        input[type="submit"] { padding: 10px 20px; cursor: pointer; margin-top: 10px; }
        input[type="text"] { width: 95%; padding: 10px; }
    </style>
</head>
<body>
    <h1>통합 조회 서비스</h1>

    <div class="tab-buttons">
        <button id="direct-btn" class="active" onclick="showForm('direct')">사업자 직접 입력</button>
        <button id="excel-btn" onclick="showForm('excel')">사업자 엑셀 업로드</button>
        <button id="media-btn" onclick="showForm('media')">매체 이름 검색</button>
    </div>

    <div class="tab-content">
        <div id="direct-form">
            <div class="info">사업자등록번호를 한 줄에 하나씩 입력하세요.</div>
            <form action="/lookup-direct" method="post">
                <textarea name="business_numbers" placeholder="예시)&#10;1234567890" required></textarea><br>
                <input type="submit" value="조회하기">
            </form>
        </div>

        <div id="excel-form">
            <div class="info">사업자등록번호가 첫 번째 열에 입력된 엑셀(.xlsx) 파일을 업로드하세요.</div>
            <form action="/upload-excel" method="post" enctype="multipart/form-data">
                <input type="file" name="excel_file" accept=".xlsx" required><br>
                <input type="submit" value="조회 및 다운로드">
            </form>
        </div>

        <div id="media-form">
            <div class="info">검색어(예: 미디어, 뉴스)를 입력하면 <b>방송사업자</b> 및 <b>정기간행물</b> 등록 현황을 동시에 조회합니다.</div>
            <form action="/search-media" method="post">
                <input type="text" name="keyword" placeholder="예: 미디어, 뉴스, 라디오 (띄어쓰기나 쉼표로 구분)" required><br>
                <input type="submit" value="매체 조회하기">
            </form>
        </div>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="error">{% for message in messages %}{{ message }}<br>{% endfor %}</div>
      {% endif %}
    {% endwith %}

    <script>
        function showForm(formName) {
            // 모든 폼 숨기고 버튼 비활성화
            document.getElementById('direct-form').style.display = 'none';
            document.getElementById('excel-form').style.display = 'none';
            document.getElementById('media-form').style.display = 'none';
            document.getElementById('direct-btn').classList.remove('active');
            document.getElementById('excel-btn').classList.remove('active');
            document.getElementById('media-btn').classList.remove('active');

            // 선택한 탭만 보여주기
            document.getElementById(formName + '-form').style.display = 'block';
            document.getElementById(formName + '-btn').classList.add('active');
        }
    </script>
</body>
</html>
